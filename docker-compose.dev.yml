# Local development services for Kodithuwakku Hardware POS.
# PHP runs on the host (Laravel Herd) and MySQL 8 runs as a local Windows service;
# these containers provide the remaining backing services.
#   docker compose -f docker-compose.dev.yml up -d
#
# Kept fully separate from CITIZENS Agro POS (which uses 6379 / 7700 and its own
# containers), so both projects can run at the same time:
#   Redis        127.0.0.1:6380  (container kodithuwakku-redis)
#   Meilisearch  127.0.0.1:7701  (container kodithuwakku-meilisearch)
name: kodithuwakku

services:
  redis:
    image: redis:7-alpine
    container_name: kodithuwakku-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data

  meilisearch:
    image: getmeili/meilisearch:v1.12
    container_name: kodithuwakku-meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: dev-master-key
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7701:7700"
    volumes:
      - meili-data:/meili_data

volumes:
  redis-data:
  meili-data:
